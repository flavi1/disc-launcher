# Tests à chaque push sur main et à chaque pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev dbus libglib2.0-bin python3
          rustup toolchain install stable --profile minimal
      - name: Tests unitaires
        run: cargo test --release --locked
      - name: Compilation
        run: cargo build --release --locked
      - name: Tests de bout en bout
        run: python3 tests/e2e.py target/release
