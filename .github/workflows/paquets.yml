# Paquets Debian/Ubuntu (.deb) et Arch Linux (.pkg.tar.zst), et l'extension
# Kodi service.disc-launcher (.zip, construite depuis flavi1/kodi-disc-launcher).
#
# - Push sur main : version de développement publiée automatiquement dans la
#   pré-version GitHub « dev » (remplacée à chaque push). Numéro croissant
#   pour qu'apt et pacman voient chaque construction comme une mise à jour :
#   Debian 0.5.0+git20261021124800.g068b63e, Arch 0.5.0.20261021124800.
#   Liens fixes :
#     …/releases/download/dev/disc-launcher_dev_amd64.deb
#     …/releases/download/dev/disc-launcher-dev-x86_64.pkg.tar.zst
#     …/releases/download/dev/service.disc-launcher_dev.zip
# - Étiquette vX.Y.Z : version stable publiée sous ce nom, avec le PKGBUILD
#   (somme de contrôle renseignée) et le .SRCINFO pour l'AUR.
# - Pull request ou lancement manuel : paquets construits, dans les artefacts.
name: Paquets

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paquets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.v.outputs.base }}
      deb: ${{ steps.v.outputs.deb }}
      arch: ${{ steps.v.outputs.arch }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            if [ "${GITHUB_REF_NAME}" != "v$base" ]; then
              echo "::error::L'étiquette ${GITHUB_REF_NAME} ne correspond pas à la version de Cargo.toml ($base)"
              exit 1
            fi
            echo "deb=$base" >> "$GITHUB_OUTPUT"
            echo "arch=$base" >> "$GITHUB_OUTPUT"
          else
            # Horodatage du commit (UTC) : croissant d'une construction à l'autre.
            stamp=$(TZ=UTC git log -1 --date=format-local:%Y%m%d%H%M%S --format=%cd)
            short=$(git rev-parse --short=7 HEAD)
            echo "deb=$base+git$stamp.g$short" >> "$GITHUB_OUTPUT"
            echo "arch=$base.$stamp" >> "$GITHUB_OUTPUT"
          fi

  deb:
    needs: version
    # Ubuntu 22.04 (glibc 2.35) : le paquet s'installe aussi sur Debian 12 et les Ubuntu suivantes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev
          rustup toolchain install stable --profile minimal
      - name: Compilation
        run: cargo +stable build --release --locked
      - name: Paquet
        env:
          VERSION: ${{ needs.version.outputs.deb }}
        run: packaging/debian/build-deb.sh dist
      - name: Contrôle du paquet
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb | grep -q usr/libexec/disc-launcher/disc-launcher-helper
          dpkg-deb -c dist/*.deb | grep -q usr/share/polkit-1/actions/io.github.flavi1.disclauncher.policy
      - uses: actions/upload-artifact@v4
        with:
          name: paquet-debian
          path: dist/*.deb

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Dépendances
        run: pacman -Syu --noconfirm --needed git rust sqlite polkit dbus
      - uses: actions/checkout@v4
      - name: Paquet
        env:
          BASE: ${{ needs.version.outputs.base }}
          PKGVER: ${{ needs.version.outputs.arch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          id builder >/dev/null 2>&1 || useradd -m builder
          work=/home/builder/pkg
          mkdir -p "$work"
          cp packaging/arch/PKGBUILD packaging/arch/disc-launcher.install "$work/"
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" "$work/PKGBUILD"
          # Source locale (même nom que l'archive attendue) : makepkg ne télécharge rien.
          git archive --prefix="disc-launcher-$PKGVER/" -o "$work/disc-launcher-$PKGVER.tar.gz" HEAD
          chown -R builder "$work"
          su builder -c "cd $work && makepkg -f --noconfirm"
          mkdir -p dist
          cp "$work"/*.pkg.tar.zst dist/
      - name: PKGBUILD pour l'AUR (étiquette)
        if: github.ref_type == 'tag'
        env:
          BASE: ${{ needs.version.outputs.base }}
        run: |
          work=/home/builder/aur
          mkdir -p "$work"
          cp packaging/arch/PKGBUILD packaging/arch/disc-launcher.install "$work/"
          sed -i "s/^pkgver=.*/pkgver=$BASE/" "$work/PKGBUILD"
          sum=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v$BASE.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" "$work/PKGBUILD"
          chown -R builder "$work"
          su builder -c "cd $work && makepkg --printsrcinfo > .SRCINFO"
          cp "$work/PKGBUILD" dist/PKGBUILD
          cp "$work/.SRCINFO" dist/SRCINFO
          cp "$work/disc-launcher.install" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: paquet-arch
          path: dist/*

  # Extension Kodi : branche main de son dépôt (KODI_ADDON_REF pour une autre).
  kodi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive de l'extension
        run: packaging/kodi/build-zip.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: extension-kodi
          path: dist/*.zip

  # Étiquette vX.Y.Z : version stable.
  publication:
    if: github.ref_type == 'tag'
    needs: [deb, arch, kodi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber

  # Push sur main : pré-version « dev », remplacée à chaque fois.
  developpement:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, deb, arch, kodi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pré-version « dev »
        env:
          GH_TOKEN: ${{ github.token }}
          DEB: ${{ needs.version.outputs.deb }}
          ARCH: ${{ needs.version.outputs.arch }}
        run: |
          set -e
          # Noms fixes en plus des noms complets : liens de téléchargement stables.
          cp dist/*.deb dist/disc-launcher_dev_amd64.deb
          cp "$(ls dist/*.pkg.tar.zst | head -n 1)" dist/disc-launcher-dev-x86_64.pkg.tar.zst
          cp "$(ls dist/service.disc-launcher-*.zip | head -n 1)" dist/service.disc-launcher_dev.zip
          ls -la dist
          # L'étiquette « dev » suit le dernier commit de main (pas de nouveau
          # déclenchement : un push fait avec le jeton du workflow n'en déclenche pas).
          git tag -f dev
          git push -f origin refs/tags/dev
          notes="Construction automatique du dernier commit de main ($(git rev-parse --short HEAD)) : $DEB (Debian/Ubuntu), $ARCH (Arch), et l'extension Kodi service.disc-launcher (.zip, à installer dans Kodi par « Installer depuis un fichier zip »). Remplacée à chaque push. Pour une version stable, voir les versions vX.Y.Z."
          if gh release view dev >/dev/null 2>&1; then
            gh release view dev --json assets --jq '.assets[].name' | while read -r a; do gh release delete-asset dev "$a" -y; done
            gh release edit dev --title "Développement ($DEB)" --notes "$notes" --prerelease
          else
            gh release create dev --title "Développement ($DEB)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload dev dist/*.deb dist/*.pkg.tar.zst dist/*.zip --clobber
