[package]
name = "disc-launcher"
version = "0.4.3"
edition = "2021"
description = "Détecte les disques optiques insérés et propose de les lire ou de les dumper (lecteurs multimédias, émulateurs, ~/ROMs façon ES-DE)"
license = "GPL-3.0-or-later"
repository = "https://github.com/flavi1/disc-launcher"
homepage = "https://github.com/flavi1/disc-launcher"
rust-version = "1.75"

# Aucune dépendance externe : bibliothèque standard + appels système déclarés à la main.
[dependencies]

[lib]
name = "disclauncher"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
