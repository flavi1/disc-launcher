# Outils que l'assistant privilégié peut exécuter (avec CAP_SYS_RAWIO, sous
# l'identité de l'utilisateur). Fichier lu uniquement depuis
# /etc/disc-launcher/helper-tools.toml, qui doit appartenir à root et ne pas
# être modifiable par d'autres.
#
#   path         : chemin absolu de l'outil (appartenant à root), ou liste de
#                  chemins dont le premier existant est retenu
#   allowed_args : arguments acceptés ; une entrée terminée par « = » accepte
#                  toute valeur (« --speed= » accepte « --speed=8 »)
#   path_args    : préfixes dont la valeur doit rester dans le dossier de sortie
#   device_args  : préfixes dont la valeur doit être le périphérique demandé
#   value_args   : options suivies d'une valeur séparée, de type « device » ou « path »

[tools.redumper]
path = ["/usr/local/bin/redumper", "/usr/bin/redumper"]
allowed_args = [
  "disc", "dump", "dump::extra", "protection", "refine", "split", "info", "hash", "skeleton",
  "--drive=", "--image-path=", "--image-name=", "--speed=", "--retries=",
  "--verbose", "--overwrite", "--auto-eject", "--drive-type=", "--drive-read-offset=",
  "--drive-c2-shift=", "--drive-pregap-start=", "--drive-read-method=", "--drive-sector-order=",
  "--plextor-skip-leadin", "--asus-skip-leadout", "--disable-cdtext", "--correct-offset-shift",
]
path_args = ["--image-path="]
device_args = ["--drive="]

# Syntaxe Friidump à vérifier selon la version installée.
[tools.friidump]
path = ["/usr/local/bin/friidump", "/usr/bin/friidump"]
allowed_args = ["-a", "-s", "-r"]
value_args = { "-d" = "device", "-i" = "path" }
