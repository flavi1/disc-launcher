# Profils d'invocation de l'assistant privilégié (disc-launcher-helper).
#
# L'assistant ne lance jamais une ligne de commande transmise telle quelle :
# la tâche de dump ne lui donne qu'un nom de profil, le lecteur, le dossier de
# sortie, un nom de fichier et des options prévues par le profil ; il construit
# lui-même la commande. Ce fichier doit appartenir à root et n'être modifiable
# par personne d'autre (/etc/disc-launcher/helper-tools.toml).
#
# Profils intégrés (rien à écrire ici pour les utiliser) :
#   redumper-disc  redumper disc --drive={sgdevice} --image-path={out} --image-name={name}
#   friidump       friidump -d {device} -i {out}/{name}.iso
#
# Un profil défini ici remplace entièrement le profil intégré de même nom, ou
# en ajoute un. Clés :
#   path     chemin absolu du programme (appartenant à root), ou liste dont le
#            premier existant est retenu
#   command  arguments ; gabarits {device} (/dev/srN), {sgdevice} (/dev/sgN du
#            même lecteur), {out} (dossier de sortie), {name} (nom de fichier)
#   options  options supplémentaires acceptées (réglages par lecteur, ex.
#            redumper_args de config.toml) : exactes, ou préfixe terminé par « = »
#            suivi d'une valeur simple (lettres, chiffres, _ . + -)
#
# Exemple : redumper installé ailleurs, avec une option de plus.
# [profiles.redumper-disc]
# path = ["/opt/redumper/bin/redumper"]
# command = ["disc", "--drive={sgdevice}", "--image-path={out}", "--image-name={name}"]
# options = ["--speed=", "--retries=", "--drive-type=", "--drive-read-offset=",
#            "--drive-c2-shift=", "--drive-pregap-start=", "--drive-read-method=",
#            "--drive-sector-order=", "--plextor-skip-leadin", "--asus-skip-leadout",
#            "--disable-cdtext", "--correct-offset-shift", "--verbose", "--auto-eject",
#            "--skeleton"]
