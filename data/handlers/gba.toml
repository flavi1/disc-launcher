# Gestionnaire « Nintendo Game Boy Advance » (gba) : cartouches lues par une Retrode.
# Exécuté par disc-launcher-generic. La cartouche apparaît comme un fichier
# ROM ({device}) sur le volume RETRODE. Lire ce fichier revient à dumper la
# cartouche : on ne joue donc jamais depuis la Retrode, on copie (« dump »,
# normalisé, vérifié par l'empreinte No-Intro) puis on joue la copie.
# Surcharge partielle : ~/.local/share/disc-launcher/handlers/gba.toml

[handler]
id = "gba"
name = "Nintendo Game Boy Advance"
kind = "console"
tags = ["console:gba"]

[formats]
target = "gba"
accepted = ["gba", "zip", "7z"]
multidisc = false

[dump]
verify = ["{stem}.gba"]
outputs = ["{stem}.gba"]

[[dump.plan]]
name = "copie"
media = ["cart"]

[[dump.plan.step]]
name = "copy"
command = ["disc-launcher", "rom", "copy", "{device}", "{tmp}/{stem}.gba"]
progress = "none"

[resolvers]
chain = ["redump-local"]

[emulator]
default = "retroarch"

[emulators.retroarch]
existing = ["retroarch", "-L", "{cores_dir}/mgba_libretro.so", "{path}"]

[emulators.mgba]
existing = ["mgba-qt", "-f", "{path}"]
