# Gestionnaire « Sega Master System » (mastersystem) : cartouches lues par une Retrode.
# Exécuté par disc-launcher-generic. La cartouche apparaît comme un fichier
# ROM ({device}) sur le volume RETRODE. Lire ce fichier revient à dumper la
# cartouche : on ne joue donc jamais depuis la Retrode, on copie (« dump »,
# normalisé, vérifié par l'empreinte No-Intro) puis on joue la copie.
# Surcharge partielle : ~/.local/share/disc-launcher/handlers/mastersystem.toml

[handler]
id = "mastersystem"
name = "Sega Master System"
kind = "console"
tags = ["console:mastersystem"]

[formats]
target = "sms"
accepted = ["sms", "zip", "7z"]
multidisc = false

[dump]
verify = ["{stem}.sms"]
outputs = ["{stem}.sms"]

[[dump.plan]]
name = "copie"
media = ["cart"]

[[dump.plan.step]]
name = "copy"
command = ["disc-launcher", "rom", "copy", "{device}", "{tmp}/{stem}.sms"]
progress = "none"

[resolvers]
chain = ["redump-local"]

[emulator]
default = "retroarch"

[emulators.retroarch]
existing = ["retroarch", "-L", "{cores_dir}/genesis_plus_gx_libretro.so", "{path}"]
