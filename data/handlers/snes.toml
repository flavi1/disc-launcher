# Gestionnaire « Super Nintendo » (snes) : cartouches lues par une Retrode.
# Exécuté par disc-launcher-generic. La cartouche apparaît comme un fichier
# ROM ({device}) sur le volume RETRODE. Lire ce fichier revient à dumper la
# cartouche : on ne joue donc jamais depuis la Retrode, on copie (« dump »,
# normalisé, vérifié par l'empreinte No-Intro) puis on joue la copie.
# Surcharge partielle : ~/.local/share/disc-launcher/handlers/snes.toml

[handler]
id = "snes"
name = "Super Nintendo"
kind = "console"
tags = ["console:snes"]
regional_folders = { Japan = "sfc", default = "snes" }

[formats]
target = "sfc"
accepted = ["sfc", "smc", "zip", "7z"]
multidisc = false

[dump]
verify = ["{stem}.sfc"]
outputs = ["{stem}.sfc"]

[[dump.plan]]
name = "copie"
media = ["cart"]

[[dump.plan.step]]
name = "copy"
command = ["disc-launcher", "rom", "copy", "{device}", "{tmp}/{stem}.sfc"]
progress = "none"

[resolvers]
chain = ["redump-local"]

[emulator]
default = "retroarch"

[emulators.retroarch]
existing = ["retroarch", "-L", "{cores_dir}/snes9x_libretro.so", "{path}"]
