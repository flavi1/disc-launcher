# Table des lecteurs connus. Liste indicative, à compléter.
#
#   vendor / model : identification INQUIRY (modèle comparé par préfixe)
#   firmware       : préfixe de révision (facultatif)
#   profile        : profil appliqué automatiquement quand l'entrée correspond
#   capable        : profil possible après flash (affiché par `disc-launcher doctor`)
#
# OmniDrive ne garantit pas une révision de firmware reconnaissable : après
# avoir flashé un lecteur, déclarez-le dans config.toml :
#   [drives."/dev/sr0"]
#   profile = "omnidrive"

