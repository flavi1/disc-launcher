<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- disc-launcher, GPL-3.0-or-later : cartouche de jeu générique -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7482"/>
      <stop offset="1" stop-color="#4a525e"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2574c"/>
    </linearGradient>
  </defs>
  <!-- connecteur -->
  <rect x="14" y="50" width="36" height="9" rx="1.5" fill="#3a4049"/>
  <g fill="#e0b84a">
    <rect x="17" y="52" width="2.2" height="6"/><rect x="21" y="52" width="2.2" height="6"/>
    <rect x="25" y="52" width="2.2" height="6"/><rect x="29" y="52" width="2.2" height="6"/>
    <rect x="33" y="52" width="2.2" height="6"/><rect x="37" y="52" width="2.2" height="6"/>
    <rect x="41" y="52" width="2.2" height="6"/><rect x="45" y="52" width="2.2" height="6"/>
  </g>
  <!-- boîtier -->
  <path d="M10 8 Q10 5 13 5 L51 5 Q54 5 54 8 L54 50 Q54 52 52 52 L12 52 Q10 52 10 50 Z" fill="url(#shell)" stroke="#2e333b" stroke-width="1.2"/>
  <!-- stries de préhension -->
  <g stroke="#3d444e" stroke-width="1.4" stroke-linecap="round">
    <line x1="16" y1="9.5" x2="48" y2="9.5"/><line x1="16" y1="12.5" x2="48" y2="12.5"/>
  </g>
  <!-- étiquette -->
  <rect x="15" y="17" width="34" height="27" rx="2.5" fill="url(#label)" stroke="#2e333b" stroke-width="1"/>
  <!-- manette stylisée sur l'étiquette -->
  <rect x="20" y="25" width="24" height="11" rx="5.5" fill="#ffffff" fill-opacity="0.92"/>
  <path d="M25 28.2 v4.6 M22.7 30.5 h4.6" stroke="#4a525e" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="37" cy="29" r="1.5" fill="#e2574c"/><circle cx="40.3" cy="32" r="1.5" fill="#2f5d9e"/>
</svg>
