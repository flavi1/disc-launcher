<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- disc-launcher, GPL-3.0-or-later : CD audio (repli quand le thème n'en fournit pas) -->
  <defs>
    <radialGradient id="metal" cx="32" cy="32" r="29" gradientUnits="userSpaceOnUse">
      <stop offset="0.3" stop-color="#f2f5f8"/>
      <stop offset="0.7" stop-color="#c3ccd6"/>
      <stop offset="1" stop-color="#e4e9ef"/>
    </radialGradient>
    <linearGradient id="iris" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fc8ff" stop-opacity="0.6"/>
      <stop offset="0.35" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ff98d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#93f5c3" stop-opacity="0.5"/>
    </linearGradient>
    <mask id="hole">
